name: Deploy
run-name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || format('Manual deploy by {0}', github.actor) }}

# ONE-167: 合并即自动部署 Cloudflare，合并/部署关口归用户。
# Deploy only runs after CI on main is green, or by manual dispatch.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # ONE-488: mask resource IDs that cloudflare/wrangler and `wrangler d1 execute`
      # print in later steps (D1 database + account). Values are passed via env only
      # (never inlined into `run:`, which echoes the script into the log).
      - name: Mask resource IDs
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in D1_DATABASE_ID CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!v}" ]; then echo "::add-mask::${!v}"; fi
          done

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web

      # Secrets are written to a private temp file and passed to wrangler as a
      # secrets file, and wrangler.toml placeholders (account id, D1 database,
      # TABLE_PREFIX) are resolved from organization variables — real values
      # never appear in the repo, logs, or wrangler.toml.
      - name: Materialize secrets + wrangler config
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
        run: node scripts/materialize-secrets.mjs

      # Deploy Worker (schema migrations are applied by the Worker itself on
      # setup / first read — see worker/src/lib/migrations-runner.ts).
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy --secrets-file "$RUNNER_TEMP/secrets.json"
