name = "nav"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER"
# SESSION_SECRET / SETUP_SECRET are wrangler secrets (or local env vars for
# `wrangler dev`) — never committed to this file.


[define]
APP_VERSION = "__APP_VERSION__"

[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "D1_DATABASE_NAME_PLACEHOLDER"
database_id = "D1_DATABASE_ID_PLACEHOLDER"

# Uploaded images (ONE-444). Binding name is R2 — ASSETS is already taken by
# Workers Static Assets above. Bucket name is not a secret; it is created by
# the account owner, never by this Worker.
[[r2_buckets]]
binding = "R2"
bucket_name = "nav-assets"

# No [vars] table is committed. TABLE_PREFIX is injected at deploy time by
# scripts/materialize-secrets.mjs (three-state: unset/empty → "nav_",
# "none" → "" for no-prefix, otherwise the value as-is). With no TABLE_PREFIX
# binding, the Worker defaults to DEFAULT_TABLE_PREFIX = "nav_" (zero-config
# isolation on a shared D1 database); set TABLE_PREFIX in .dev.vars to override
# for local development.
